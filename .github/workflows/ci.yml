name: NestAffiliate CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestaffiliate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
          VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: millionsnest
          VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
          VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"
          VITE_APP_URL: https://nestaffiliate.millionsnest.com
          VITE_HUB_URL: https://www.millionsnest.com
        run: pnpm build
