name: Diagnostic - Live Firebase Hosting AppCheck headers
on:
  push:
    branches:
      - main
      - production
      - diagnostics/appcheck-live-hosting-probe-20261010
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  inspect-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production and default Hosting domain
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, re
          domains=[
            "https://nestaffiliate.millionsnest.com/",
            "https://mn-nestaffiliate-555464791734.web.app/"
          ]
          rules={
            "script-src":["https://www.google.com/recaptcha/","https://www.gstatic.com/recaptcha/"],
            "frame-src":["https://www.google.com/recaptcha/","https://recaptcha.google.com/recaptcha/"],
            "connect-src":["https://www.google.com/recaptcha/","https://firebaseappcheck.googleapis.com"]
          }
          # Fetch HTTP headers only; no auth/cookies/users/secrets.
          for domain in domains:
            print("\\nLIVE_ORIGIN",domain)
            try:
              request=urllib.request.Request(domain,method="GET",headers={"User-Agent":"NestAffiliate-AppCheck-Header-Diagnostic/1"})
              with urllib.request.urlopen(request,timeout=18) as res:
                headers=res.headers
                print("HTTP_STATUS",res.status)
                print("FINAL_ORIGIN",urllib.parse.urlsplit(res.url).netloc)
                print("CACHE_CONTROL",headers.get("cache-control","MISSING"))
                policy=headers.get("content-security-policy","")
                if not policy:
                  print("CSP_HEADER_MISSING")
                  continue
                print("LIVE_CSP",policy)
                parts={}
                for part in policy.split(";"):
                  token=part.strip()
                  if not token:continue
                  name,*values=token.split()
                  parts[name]=values
                for directive,origins in rules.items():
                  values=parts.get(directive,parts.get("default-src",[]))
                  for origin in origins:
                    # Check exact allowed host or a narrower sub-path; a host-source permits descendants.
                    parsed=urllib.parse.urlsplit(origin)
                    host=f"{parsed.scheme}://{parsed.netloc}"
                    ok=any(item==host or item.startswith(origin) or item=="*" or (item.startswith("https://*.") and host.endswith(item[len("https://*.")-1:])) for item in values)
                    print(f"CHECK {directive} {origin} {'ALLOW' if ok else 'MISSING'}")
            except Exception as exc:
              print("SITE_PROBE_FAILED",type(exc).__name__,str(exc)[:140])
          PY



  verify-real-production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare actual published site keys with registered Enterprise key
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          expected_key='6LcpY-EtAAAAAElqBbIL_K7nAkm2wpuF6fbhsggG'
          expected_app='1:555464791734:web:6f916a69f26e74b9767817'
          for base in ['https://nestaffiliate.millionsnest.com/','https://mn-nestaffiliate-555464791734.web.app/']:
            def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NestAffiliate-P0-Release-Audit','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as res:
                return res.read().decode('utf-8','replace')
            html=fetch(base)
            paths=set(re.findall(r'<script[^>]+src=["\x27]([^"\x27]+\.js(?:\?[^"\x27]*)?)["\x27]',html,re.I))
            paths|=set(re.findall(r'<link[^>]+rel=["\x27]modulepreload["\x27][^>]+href=["\x27]([^"\x27]+\.js[^"\x27]*)["\x27]',html,re.I))
            seen=set()
            contents=[]
            to_visit=[urllib.parse.urljoin(base,p) for p in paths]
            while to_visit and len(seen)<50:
              url=to_visit.pop(0)
              if url in seen:continue
              seen.add(url)
              if urllib.parse.urlsplit(url).netloc!=urllib.parse.urlsplit(base).netloc:continue
              txt=fetch(url)
              contents.append(txt)
              for match in re.findall(r'["\x27]([^"\x27]+\.js)["\x27]',txt):
                if '/assets/' in match or match.startswith('./'):
                  url2=urllib.parse.urljoin(url,match)
                  if url2 not in seen and url2 not in to_visit:to_visit.append(url2)
            body='\n'.join(contents)
            keys=set(re.findall(r'6L[A-Za-z0-9_-]{25,100}',body))
            appids=set(re.findall(r'1:555464791734:web:[A-Za-z0-9]+',body))
            print('PROD_HOST',urllib.parse.urlsplit(base).netloc)
            print('JS_ASSETS_SCANNED',len(contents))
            print('ACTUAL_ENT_KEY_PRESENT',expected_key in keys)
            print('OTHER_ENTERPRISE_KEY_COUNT',len(keys-{expected_key}))
            print('CORRECT_FIREBASE_APP_ID_PRESENT',expected_app in appids)
            print('OTHER_FIREBASE_APP_ID_COUNT',len(appids-{expected_app}))
            print('E2E_MOCK_AUTH_STRING_PRESENT','e2e-app-check-token' in body)
            print('EARLY_APP_CHECK_MARKER_PRESENT','APP_CHECK_NOT_INITIALIZED' in body)
            print('APP_CHECK_SDK_ERROR_VALIDATOR_PRESENT','RECAPTCHA_ERROR' in body and 'INITIAL_THROTTLE' in body)
            if expected_key not in keys or len(keys-{expected_key}) or expected_app not in appids:
              raise SystemExit('PRODUCTION_FIREBASE_CONFIG_MISMATCH')
          PY

  verify-live-appcheck-client:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect current published Vite JavaScript for the new App Check safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,urllib.parse
          for base in ['https://nestaffiliate.millionsnest.com/','https://mn-nestaffiliate-555464791734.web.app/']:
              html=urllib.request.urlopen(urllib.request.Request(base,headers={'Cache-Control':'no-cache'}),timeout=15).read().decode('utf-8','replace')
              assets=re.findall(r'<script[^>]+src=["\\']([^"\\']+\\.js[^"\\']*)["\\']',html,re.I)
              scripts=[]
              for path in assets[:6]:
                  url=urllib.parse.urljoin(base,path)
                  scripts.append(urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=18).read().decode('utf-8','replace'))
              bundle='\\n'.join(scripts)
              print('LIVE_ORIGIN',urllib.parse.urlsplit(base).netloc)
              print('LIVE_SCRIPT_ASSETS_FOUND',len(assets))
              print('EARLY_APPCHECK_CODE_DEPLOYED','YES' if 'APP_CHECK_NOT_INITIALIZED' in bundle else 'NO')
              print('SDK_DUMMY_TOKEN_GUARD_DEPLOYED','YES' if 'APP_CHECK_EMPTY_TOKEN' in bundle and 'RECAPTCHA_ERROR' in bundle else 'NO')
          PY


  browser-appcheck-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install public SDK dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Bundle isolated App Check probe (NOT deployed)
        run: pnpm dlx esbuild@0.25.12 apps/web/appcheck-live-smoke.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/nestaffiliate-appcheck-smoke.js
      - name: Verify live production App Check attestation
        run: node scripts/check-live-appcheck.mjs


  firebase-credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check existing admin credential availability (boolean only)
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_MILLIONSNEST" || -n "$FIREBASE_SERVICE_ACCOUNT" || -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" || -n "$GCP_SA_KEY" ]]; then
            echo "FIREBASE_SERVICE_ADMIN_CREDENTIAL_PRESENT=true"
          else
            echo "FIREBASE_SERVICE_ADMIN_CREDENTIAL_PRESENT=false"
          fi
          if [[ -n "$FIREBASE_TOKEN" ]]; then
            echo "FIREBASE_CLI_TOKEN_PRESENT=true"
          else
            echo "FIREBASE_CLI_TOKEN_PRESENT=false"
          fi
          # Never print any secret or token.
